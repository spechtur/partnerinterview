<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#23b2c6">
<title>Partnerinterview · PHGR</title>
<style>
  :root{
    --bg:#23b2c6;--fg:#1c1c1c;
    --sans:'DejaVu Sans','Verdana','Tahoma',sans-serif;
    --serif:'DejaVu Serif',Georgia,'Times New Roman',serif;
    --line:color-mix(in srgb,var(--fg) 26%,transparent);
    --soft:color-mix(in srgb,var(--fg) 8%,transparent);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{min-height:100%}
  body{
    font-family:var(--sans);background:var(--bg);color:var(--fg);
    transition:background .55s ease,color .55s ease;
    display:flex;flex-direction:column;min-height:100vh;-webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;color:inherit}
  button:focus-visible,[tabindex]:focus-visible{outline:.2em solid var(--fg);outline-offset:.15em}

  /* Kopfzone: Wortmarke + Timerbalken, zusammen angeheftet */
  #topbar{position:sticky;top:0;z-index:60;flex-shrink:0;background:var(--bg);transition:background .55s ease}
  header{
    display:flex;align-items:baseline;gap:.9rem;
    padding:max(.8rem,env(safe-area-inset-top)) max(1.1rem,env(safe-area-inset-right)) .7rem max(1.1rem,env(safe-area-inset-left));
  }
  .logo{display:flex;align-items:baseline}
  .ph{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:1.3rem}
  .gr{font-variant:small-caps;font-weight:300;font-size:1.3rem;letter-spacing:.03em}
  .header-title{font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:.78rem;opacity:.8}
  #bar-track{height:max(8px,1.1vh);margin:0 max(1.1rem,env(safe-area-inset-right)) 0 max(1.1rem,env(safe-area-inset-left));border-radius:99px;background:var(--line);overflow:hidden}
  #bar-fill{height:100%;width:100%;border-radius:99px;background:var(--fg)!important;transition:width .25s linear}

  /* Inhalt */
  main{flex:1 0 auto;width:100%;max-width:46rem;margin:0 auto;padding:1.4rem max(1.1rem,env(safe-area-inset-right)) 9rem max(1.1rem,env(safe-area-inset-left));display:flex;flex-direction:column;gap:1.1rem}

  .intro{display:flex;flex-direction:column;gap:.7rem;padding-bottom:.4rem}
  .phase-tag{align-self:flex-start;font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:.78rem;border:.14em solid var(--fg);border-radius:99px;padding:.3em .9em}
  .intro h1{font-weight:800;font-size:clamp(1.6rem,6.4vw,2.6rem);line-height:1.08;letter-spacing:-.012em;text-wrap:balance}
  .intro p{font-family:var(--serif);font-style:italic;font-size:clamp(1rem,3.8vw,1.2rem);line-height:1.3;text-wrap:balance;opacity:.92}

  #liste{display:flex;flex-direction:column;list-style:none;border-top:2px solid var(--line)}
  .frage{
    display:flex;gap:.9rem;align-items:flex-start;cursor:pointer;
    padding:1rem .2rem;border-bottom:2px solid var(--line);
    font-size:clamp(1.02rem,4vw,1.2rem);line-height:1.38;font-weight:600;
    transition:opacity .18s,transform .1s;
  }
  .frage:active{transform:scale(.99)}
  .frage .nr{flex:none;border:.14em solid var(--fg);border-radius:.4em;padding:.1em .45em;font-weight:800;font-size:.8em;letter-spacing:.06em;font-variant-numeric:tabular-nums;margin-top:.05em}
  .frage.gestrichen{opacity:.4}
  .frage.gestrichen .txt{text-decoration:line-through;text-decoration-thickness:.1em}
  body.interview .frage{cursor:default;font-size:clamp(1.15rem,4.6vw,1.5rem);line-height:1.3;font-weight:800;letter-spacing:-.01em;padding:1.15rem .2rem}
  body.interview .frage .nr{background:var(--fg);color:var(--bg)}

  #eigene{padding-top:.6rem}
  #eigene label{display:block;font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:.78rem;opacity:.8;margin-bottom:.6rem}
  .eigene-zeile{display:flex;gap:.6rem;align-items:stretch}
  #eigene-text{
    flex:1;min-width:0;font-family:var(--sans);font-size:1rem;color:var(--fg);
    background:var(--soft);border:.14em solid var(--fg);border-radius:.45em;padding:.8em .9em;outline:none;
  }
  #eigene-text::placeholder{color:var(--fg);opacity:.55}
  #eigene-text:focus{outline:.2em solid var(--fg);outline-offset:.1em}
  #eigene-btn{white-space:nowrap}
  @media (max-width:460px){.eigene-zeile{flex-direction:column}#eigene-btn{width:100%}}

  .hinweis{padding:1.6rem .2rem;font-family:var(--serif);font-style:italic;font-size:1.1rem;line-height:1.35;border-bottom:2px solid var(--line)}
  .hinweis strong{display:block;font-family:var(--sans);font-style:normal;font-weight:800;font-size:clamp(1.5rem,6vw,2.2rem);line-height:1.1;margin-bottom:.6rem}

  /* Fussleiste */
  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);
    border-top:2px solid var(--line);transition:background .55s ease;
    padding:.8rem max(1rem,env(safe-area-inset-right)) calc(.8rem + env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));
  }
  .footer-inner{max-width:46rem;margin:0 auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:center}
  .zaehler{font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;opacity:.8;margin-right:auto}
  #restzeit{font-weight:800;font-size:clamp(1.5rem,6vw,2rem);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-right:auto;min-width:4.2rem}
  #restzeit.aus{animation:puls 1s ease-in-out infinite}
  @keyframes puls{50%{opacity:.35}}

  .btn{
    font:800 clamp(.88rem,3.4vw,1rem) var(--sans);text-transform:uppercase;letter-spacing:.08em;
    min-height:3rem;padding:.7em 1.1em;border:.14em solid var(--fg);border-radius:.45em;
    background:transparent;color:var(--fg);cursor:pointer;transition:transform .12s ease,opacity .15s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px)}
  .btn-primary,.btn-go{background:var(--fg);color:var(--bg)}
  .btn-go,.btn-pause{min-width:7rem}
  .btn-pause{background:transparent;color:var(--fg)}
  .btn-sec{opacity:.8}

  .toast{
    position:fixed;left:50%;bottom:6.5rem;transform:translateX(-50%) translateY(12px);
    background:var(--fg);color:var(--bg);font-weight:800;font-size:.9rem;letter-spacing:.02em;
    padding:.75em 1.2em;border-radius:99px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Meldung zur Halbzeit und kurz vor Schluss: ganzflächige Farbe */
  #melder{
    position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:flex-start;justify-content:center;
    padding:max(2rem,env(safe-area-inset-top)) max(1.6rem,6vw) max(2rem,env(safe-area-inset-bottom));cursor:pointer;
  }
  #melder.offen{display:flex;animation:auf .22s ease-out}
  #melder.halbzeit{background:#fbb900;color:#1c1c1c}
  #melder.endspurt{background:#ed6a69;color:#1c1c1c}
  @keyframes auf{from{opacity:0}to{opacity:1}}
  #melder .tafel{width:min(46rem,100%);display:flex;flex-direction:column;gap:1.2rem;align-items:flex-start}
  #melder .tafel::before{content:'';width:clamp(3.5rem,14vw,9rem);height:max(7px,1.1vh);border-radius:99px;background:currentColor}
  #melder .wort{font-weight:800;font-size:clamp(2.6rem,13vw,6rem);line-height:1.02;letter-spacing:-.015em;text-wrap:balance}
  #melder .satz{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,4.4vw,1.6rem);line-height:1.28;text-wrap:balance}
  #melder .zu{margin-top:.6rem;background:#1c1c1c;color:inherit;border-color:#1c1c1c}
  #melder.halbzeit .zu{color:#fbb900}
  #melder.endspurt .zu{color:#ed6a69}

  @keyframes rise{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
  .rise{animation:rise .45s ease both}
  @media (prefers-reduced-motion:reduce){.rise,#melder.offen{animation:none}body{transition:none}}

  @media (max-width:460px){
    /* Die Bedienzeile muss in eine Zeile passen: Wörter weg, Zeichen bleiben –
       nur der Hauptknopf behält seine Beschriftung. */
    .footer-inner{flex-wrap:nowrap;gap:.4rem}
    .btn{padding:.65em .75em;min-height:2.9rem}
    .btn .wort{display:none}
    .btn-go,.btn-pause{min-width:0}
    .btn-go .wort,.btn-pause .wort,.btn-primary .wort{display:inline}
    #restzeit{font-size:1.45rem;min-width:0;margin-right:.2rem}
  }
  @media (min-width:900px) and (min-aspect-ratio:5/4){
    .intro h1{font-size:min(2.8rem,4vw,7vh)}
  }
</style>
</head>
<body>

<div id="topbar">
  <header>
    <div class="logo"><span class="ph">ph</span><span class="gr">GR</span></div>
    <div class="header-title">Partnerinterview</div>
  </header>
  <div id="bar-track"><div id="bar-fill"></div></div>
</div>

<main>
  <div class="intro" id="intro">
    <div class="phase-tag" id="phase-tag">Auswahl</div>
    <h1 id="titel">Fragensatz wird geladen …</h1>
    <p id="untertitel">Einen Moment bitte.</p>
  </div>
  <ul id="liste"></ul>

  <div id="eigene" hidden>
    <label for="eigene-text">Eigene Frage ergänzen</label>
    <div class="eigene-zeile">
      <input type="text" id="eigene-text" maxlength="300" autocomplete="off"
             placeholder="Was möchtest du gefragt werden?">
      <button class="btn btn-primary" id="eigene-btn" type="button">+ Hinzufügen</button>
    </div>
  </div>
</main>

<footer id="footer" hidden>
  <div class="footer-inner" id="footer-inner"></div>
</footer>

<div id="melder">
  <div class="tafel">
    <div class="wort" id="melder-wort"></div>
    <div class="satz" id="melder-satz"></div>
    <button class="btn btn-primary zu" id="melder-zu">Weiter</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* Notfall-Fragensatz: greift, wenn die Seite ohne Konfiguration und ohne
   erreichbare JSON-Datei geöffnet wird (z. B. lokal per Doppelklick). */
const DEFAULT_SLUG = 'digitalitaet-eigene-ressourcen';
const FALLBACK = {
  titel: 'Eigene Ressourcen in einer Kultur der Digitalität',
  timer_sekunden: 300,
  fragen: [
    'Welches digitale Werkzeug setzt du bereits so sicher ein, dass du es anderen zeigen könntest?',
    'Wann hast du zuletzt gemerkt: «Das hat mit Technik richtig gut funktioniert»?',
    'Welche analoge Stärke von dir hilft dir auch im Digitalen weiter?',
    'Wen fragst du, wenn du bei einem digitalen Thema nicht weiterkommst?',
    'Was hast du dir im letzten Jahr digital selbst beigebracht – und wie bist du dabei vorgegangen?',
    'Welche Unsicherheit im Umgang mit Digitalität nimmst du bei dir wahr, ohne dass sie dich lähmt?',
    'Woran merkst du, dass digitale Medien dem Lernen wirklich dienen?',
    'Welche Regel oder Routine hat sich bei dir bewährt, damit Digitales im Alltag nicht ausufert?',
    'Was würdest du an deiner Schule als Erstes ändern, wenn du freie Hand hättest?',
    'Welche Erfahrung aus deiner eigenen Schulzeit prägt deinen Blick auf Digitalität heute noch?',
    'Wo hat dein Fach durch Digitalität etwas gewonnen – und nicht nur etwas verloren?',
    'Was möchtest du in den nächsten Monaten ausprobieren, auch wenn es schiefgehen könnte?'
  ]
};
const DEFAULT_SEKUNDEN = 300;

/* ── Zustand ─────────────────────────────────────────────── */
let fragen      = [];        // alle Fragen des Satzes
let gestrichen  = new Set(); // Indizes der durchgestrichenen Fragen
let auswahl     = null;      // nach dem Fixieren: die verbleibenden Fragen
let dauer       = DEFAULT_SEKUNDEN;
let rest        = DEFAULT_SEKUNDEN;
let laeuft      = false;
let tick        = null;
let endeZeit    = 0;   // Zeitstempel, an dem die Runde ausläuft
let audioCtx    = null;
let toastTimer  = null;
let meilensteine = [];       // Restzeiten, bei denen eine Meldung erscheint
let gemeldet     = new Set();

const $ = id => document.getElementById(id);

/* Ganzflächige Farbe je Phase (PH-Bold): Auswahl Türkis, Interview Violett. */
const FARBEN = {
  auswahl:   ['#23b2c6', '#1c1c1c'],
  interview: ['#6169af', '#ffffff'],
  fehler:    ['#c6c6c6', '#1c1c1c']
};
function faerbe(name) {
  const [bg, fg] = FARBEN[name];
  document.documentElement.style.setProperty('--bg', bg);
  document.documentElement.style.setProperty('--fg', fg);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
}
function einblenden() {
  const el = $('intro');
  el.classList.remove('rise'); void el.offsetWidth; el.classList.add('rise');
}

/* ── Konfiguration aus dem Link ──────────────────────────── */
/* Zwei Wege: #d=… trägt den vollen Fragensatz im Link (aus der
   Vorbereitungsansicht), ?set=slug lädt eine JSON-Datei aus saetze/. */
(async function init() {
  const daten = (location.hash.match(/[#&]d=([A-Za-z0-9\-_]+)/) || [])[1];
  if (daten) {
    try { return starte(await auspacken(daten)); }
    catch (e) { return fehler(null, 'Der Link ist unvollständig oder beschädigt.'); }
  }
  const p = new URLSearchParams(location.search);
  const slug = p.get('set');
  try {
    const res = await fetch('saetze/' + encodeURIComponent(slug || DEFAULT_SLUG) + '.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const satz = await res.json();
    /* Kleine Abweichungen vom hinterlegten Satz reisen als Parameter mit,
       damit der QR-Code kurz bleibt. */
    if (p.get('t'))     satz.timer_sekunden = Number(p.get('t'));
    if (p.get('titel')) satz.titel = p.get('titel');
    starte(satz);
  } catch (e) {
    if (slug) fehler(slug); else starte(FALLBACK);
  }
})();

function starte(satz) {
  fragen = Array.isArray(satz.fragen) ? satz.fragen.map(f => String(f).trim()).filter(Boolean) : [];
  if (!fragen.length) return fehler(null);
  dauer = Number(satz.timer_sekunden) > 0 ? Math.round(Number(satz.timer_sekunden)) : DEFAULT_SEKUNDEN;
  rest  = dauer;
  setzeMeilensteine();
  $('titel').textContent = satz.titel || 'Partnerinterview';
  $('untertitel').textContent =
    'Tippe die Fragen an, die du im anschliessenden Interview nicht gestellt bekommen möchtest – sie ' +
    'werden durchgestrichen. Unten kannst du eigene Fragen ergänzen. Wenn deine Auswahl steht, tippe ' +
    'auf «Interview fixieren».';
  document.title = $('titel').textContent + ' · Partnerinterview';
  zeichneListe();
  zeichneFooter();
  zeigeZeit();
  $('footer').hidden = false;
  $('eigene').hidden = false;
}

function fehler(slug, zusatz) {
  faerbe('fehler');
  $('intro').hidden = true;
  $('liste').innerHTML =
    '<li class="hinweis"><strong>Diesen Fragensatz gibt es nicht.</strong>' +
    (zusatz ? esc(zusatz) + ' ' : '') +
    (slug ? 'Der Link verweist auf «' + esc(slug) + '», dazu ist hier nichts hinterlegt. ' : '') +
    'Bitte prüfe den QR-Code oder frag die Kursleitung nach dem richtigen Link.</li>';
}

/* ── Fragenliste ─────────────────────────────────────────── */
function zeichneListe() {
  const liste = $('liste');
  liste.innerHTML = '';
  if (auswahl) {
    auswahl.forEach((text, i) => liste.appendChild(zeile(text, i + 1, false, null)));
    return;
  }
  fragen.forEach((text, i) => {
    liste.appendChild(zeile(text, i + 1, gestrichen.has(i), () => streiche(i)));
  });
}

function zeile(text, nr, aus, onClick) {
  const li = document.createElement('li');
  li.className = 'frage' + (aus ? ' gestrichen' : '');
  li.innerHTML = '<span class="nr">' + String(nr).padStart(2, '0') + '</span><span class="txt">' + esc(text) + '</span>';
  if (onClick) {
    li.setAttribute('role', 'button');
    li.setAttribute('tabindex', '0');
    li.setAttribute('aria-pressed', aus ? 'true' : 'false');
    li.addEventListener('click', onClick);
    li.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); onClick(); }
    });
  }
  return li;
}

/* Eigene Fragen landen am Ende der Liste und verhalten sich danach wie
   jede andere: antippbar, streichbar, in der nächsten Runde wieder dabei. */
function ergaenze() {
  const feld = $('eigene-text');
  const text = feld.value.trim();
  if (!text) return feld.focus();
  if (fragen.some(f => f.toLowerCase() === text.toLowerCase())) {
    feld.select();
    return toast('Diese Frage steht schon in der Liste.');
  }
  fragen.push(text);
  feld.value = '';
  zeichneListe();
  zeichneFooter();
  $('liste').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' });
  toast('Frage ergänzt.');
}

$('eigene-btn').addEventListener('click', ergaenze);
$('eigene-text').addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { ev.preventDefault(); ergaenze(); }
});

function streiche(i) {
  gestrichen.has(i) ? gestrichen.delete(i) : gestrichen.add(i);
  zeichneListe();
  zeichneFooter();
}

function fixiere() {
  const bleibt = fragen.filter((_, i) => !gestrichen.has(i));
  if (!bleibt.length) return toast('Mindestens eine Frage muss stehen bleiben.');
  auswahl = bleibt;
  $('eigene').hidden = true;   // die Liste steht jetzt fest
  document.body.classList.add('interview');
  faerbe('interview'); einblenden();
  $('phase-tag').textContent = 'Interview';
  $('phase-tag').classList.add('interview');
  $('untertitel').textContent =
    'Eine Person fragt, die andere erzählt. Startet den Timer – wenn er abgelaufen ist, ' +
    'gebt euch eine kurze, ressourcenorientierte Rückmeldung.';
  zeichneListe();
  zeichneFooter();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function neueRunde() {
  laeuft = false; clearInterval(tick); rest = dauer;
  gemeldet.clear(); schliesseMelder();
  auswahl = null;
  gestrichen.clear();
  $('eigene').hidden = false;
  document.body.classList.remove('interview');
  faerbe('auswahl'); einblenden();
  $('phase-tag').textContent = 'Auswahl';
  $('phase-tag').classList.remove('interview');
  $('untertitel').textContent =
    'Rollentausch: Tippe die Fragen an, die du nicht gestellt bekommen möchtest, und fixiere die Liste neu.';
  zeichneListe();
  zeichneFooter();
  zeigeZeit();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Fussleiste ──────────────────────────────────────────── */
function zeichneFooter() {
  const box = $('footer-inner');
  box.innerHTML = '';

  if (!auswahl) {
    const offen = fragen.length - gestrichen.size;
    const z = document.createElement('div');
    z.className = 'zaehler';
    z.textContent = offen + ' von ' + fragen.length + (offen === 1 ? ' Frage' : ' Fragen');
    box.appendChild(z);
    box.appendChild(knopf('✓', 'Interview fixieren', 'btn-primary', fixiere));
    return;
  }

  const t = document.createElement('div');
  t.id = 'restzeit';
  box.appendChild(t);
  box.appendChild(knopf(laeuft ? '❚❚' : '▶', laeuft ? 'Pause' : 'Start', laeuft ? 'btn-pause' : 'btn-go', toggle));
  box.appendChild(knopf('■', 'Stopp', 'btn-sec', stopp));
  box.appendChild(knopf('↻', 'Restart', 'btn-sec', restart));
  box.appendChild(knopf('↺', 'Neue Runde', 'btn-sec', neueRunde));
  zeigeZeit();
}

function knopf(zeichen, wort, cls, fn) {
  const b = document.createElement('button');
  b.className = 'btn ' + cls;
  b.innerHTML = '<span class="zeichen">' + zeichen + '</span><span class="wort"> ' + esc(wort) + '</span>';
  b.title = wort;
  b.setAttribute('aria-label', wort);
  b.addEventListener('click', () => { weckeAudio(); fn(); });
  return b;
}

/* ── Timer ───────────────────────────────────────────────── */
/* Halbzeit und letzte Minute ergeben sich aus der eingestellten Dauer –
   sie stehen nicht im Fragensatz und blähen den QR-Code deshalb nicht auf.
   Zu kurze Runden bekommen weniger Meldungen, damit sie nicht kollidieren. */
function setzeMeilensteine() {
  meilensteine = [];
  gemeldet.clear();
  const halb = Math.floor(dauer / 2);
  if (halb >= 120) {   // mindestens eine Minute Abstand zur Schlussmeldung
    meilensteine.push({ bei: halb, wort: 'Halbzeit', satz: 'Die Hälfte der Zeit ist um – tauscht ihr schon, oder erzählt dieselbe Person weiter?' });
  }
  if (dauer >= 120) {
    meilensteine.push({ bei: 60, wort: 'Noch eine Minute', satz: 'Kommt zu einem guten Schluss.' });
  }
}

/* Ausgelöst wird beim Unterschreiten, nicht beim exakten Treffer – sonst
   fällt eine Meldung aus, wenn der Browser Sekunden überspringt. Wurden
   mehrere auf einmal überholt, zählt die jüngste. */
function pruefeMeilenstein(vorher) {
  const faellig = meilensteine.filter(x => vorher > x.bei && rest <= x.bei && !gemeldet.has(x.bei));
  if (!faellig.length) return;
  faellig.forEach(x => gemeldet.add(x.bei));
  zeigeMelder(faellig.reduce((a, b) => (a.bei <= b.bei ? a : b)));
}

function zeigeMelder(m) {
  $('melder-wort').textContent = m.wort;
  $('melder-satz').textContent = m.satz;
  const el = $('melder');
  el.className = 'offen ' + (m.bei === 60 ? 'endspurt' : 'halbzeit');
  pling(m.bei === 60 ? 660 : 520);
}

function schliesseMelder() { $('melder').className = ''; }

$('melder').addEventListener('click', schliesseMelder);
document.addEventListener('keydown', e => { if (e.key === 'Escape') schliesseMelder(); });

function toggle() { laeuft ? pause() : start(); }

/* Die Restzeit kommt aus einem Zeitstempel, nicht aus einem Zähler:
   Sperrt sich der Bildschirm oder wechselt die TN die App, drosselt der
   Browser das Intervall – ein Zähler würde dann nachgehen und einzelne
   Sekunden überspringen. */
function start() {
  if (laeuft) return;
  if (rest <= 0) { rest = dauer; gemeldet.clear(); }
  endeZeit = Date.now() + rest * 1000;
  laeuft = true;
  clearInterval(tick);
  tick = setInterval(schlag, 250);
  zeichneFooter();
}

function schlag() {
  const vorher = rest;
  rest = Math.max(0, Math.round((endeZeit - Date.now()) / 1000));
  if (rest === vorher) return;
  zeigeZeit();
  if (rest === 0) { laeuft = false; clearInterval(tick); schliesseMelder(); gong(); zeichneFooter(); }
  else pruefeMeilenstein(vorher);
}

function pause()   { laeuft = false; clearInterval(tick); zeichneFooter(); }
function stopp()   { laeuft = false; clearInterval(tick); rest = dauer; gemeldet.clear(); schliesseMelder(); zeichneFooter(); }
function restart() { laeuft = false; clearInterval(tick); rest = dauer; gemeldet.clear(); schliesseMelder(); start(); }

function zeigeZeit() {
  const anteil = dauer > 0 ? rest / dauer : 0;
  const fill = $('bar-fill');
  /* Abgelaufen: Balken bleibt voll und rot stehen – als sichtbares Signal. */
  fill.style.width = (rest === 0 ? 100 : anteil * 100).toFixed(2) + '%';
  fill.style.backgroundColor = farbe(anteil);

  const feld = $('restzeit');
  if (!feld) return;
  feld.textContent = Math.floor(rest / 60) + ':' + String(rest % 60).padStart(2, '0');
  feld.classList.toggle('aus', rest === 0);
}

/* Grün → Gelb → Orange → Rot, linear über die Restzeit interpoliert. */
function farbe(a) {
  const stops = [
    [0.00, [237, 106, 105]], // rot
    [0.25, [251, 185,   0]], // orange
    [0.55, [199, 210,   0]], // gelb
    [1.00, [ 90, 171, 110]]  // grün
  ];
  a = Math.min(1, Math.max(0, a));
  for (let i = 1; i < stops.length; i++) {
    if (a <= stops[i][0]) {
      const [p0, c0] = stops[i - 1], [p1, c1] = stops[i];
      const t = (a - p0) / (p1 - p0);
      return 'rgb(' + c0.map((v, k) => Math.round(v + (c1[k] - v) * t)).join(',') + ')';
    }
  }
  return 'rgb(90,171,110)';
}

/* ── Ton ─────────────────────────────────────────────────── */
function weckeAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

/* Ein einzelner, kurzer Ton – deutlich zurückhaltender als der Schluss-Gong. */
function pling(freq) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine'; osc.frequency.value = freq;
  const t = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.22, t + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
  osc.start(t); osc.stop(t + 0.6);
}

function gong() {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  [880, 660, 440].forEach((f, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.value = f;
    const t = audioCtx.currentTime + i * 0.3;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.35, t + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    osc.start(t); osc.stop(t + 0.75);
  });
}

/* ── Link-Nutzlast auspacken (Gegenstück zu presenter.html) ── */
async function auspacken(code) {
  const marke = code[0], rumpf = entb64u(code.slice(1));
  let bytes = rumpf;
  if (marke === '1') {
    const ds = new DecompressionStream('deflate-raw');
    const w  = ds.writable.getWriter(); w.write(rumpf); w.close();
    bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  const o = JSON.parse(new TextDecoder().decode(bytes));
  return { titel: o.t, timer_sekunden: o.s, fragen: o.f };
}

function entb64u(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(s + '='.repeat((4 - s.length % 4) % 4));
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

/* ── Kleinkram ───────────────────────────────────────────── */
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
